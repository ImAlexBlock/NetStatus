name: build-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Name artifact
        run: |
          VERSION=$(sed -nE 's/.*versionName = "(.*)".*/\1/p' app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk "NetStatus-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          echo "APK=NetStatus-${VERSION}-${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          files: ${{ env.APK }}
          make_latest: true
